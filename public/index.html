<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="description" content="全球 IPTV 与 FM/AM/SW 广播聚合播放面板" />
    <title>Global IPTV &amp; Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322D3EE'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230B0F1A'/%3E%3Cpath d='M8 11h16v10H8z' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Cpath d='M12 8l6 4-6 4z' fill='url(%23g)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar"></header>
      <div class="app-body">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="view" id="view">
          <div class="boot-splash" id="boot-splash">
            <div class="boot-splash__logo"></div>
            <p>正在装配全球频道库…</p>
          </div>
        </main>
      </div>
      <div id="player-dock" class="player-dock"></div>
      <nav class="mobile-nav" id="mobile-nav"></nav>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <script type="module" src="/js/app.js"></script>
    <noscript>
      <p style="padding: 24px; color: #e5e7eb">本面板需要启用 JavaScript 才能使用。</p>
    </noscript>
  </body>
